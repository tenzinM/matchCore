<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MatchCore — Live Order Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MatchCore</h1>
    <p>Live limit order book — price-time priority matching engine</p>
    <span id="status" class="status disconnected">disconnected</span>
  </header>

  <main>
    <section class="book-panel">
      <h2>Order Book <span id="symbol"></span></h2>
      <div class="book-columns">
        <div class="asks-column">
          <div class="col-header">Asks (sell)</div>
          <table id="asks-table"><tbody></tbody></table>
        </div>
        <div class="bids-column">
          <div class="col-header">Bids (buy)</div>
          <table id="bids-table"><tbody></tbody></table>
        </div>
      </div>
    </section>

    <section class="submit-panel">
      <h2>Submit Order</h2>
      <form id="order-form">
        <label>Order ID <input id="order-id" type="text" required /></label>
        <label>Side
          <select id="side">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </label>
        <label>Price <input id="price" type="number" step="0.01" min="0.01" required /></label>
        <label>Quantity <input id="quantity" type="number" step="0.01" min="0.01" required /></label>
        <button type="submit">Submit</button>
      </form>
      <div id="submit-result"></div>

      <div class="quick-actions">
        <button id="random-order-btn">Submit random order</button>
      </div>
    </section>

    <section class="trades-panel">
      <h2>Trade Tape</h2>
      <table id="trades-table">
        <thead><tr><th>Price</th><th>Qty</th><th>Buy ID</th><th>Sell ID</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
